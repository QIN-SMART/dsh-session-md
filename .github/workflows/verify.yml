name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node --test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 与 macOS 是真实使用场景，Linux 是最便宜的回归网。
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 本包没有构建步骤、没有运行时依赖：直接在真实产物 lib/client.js 上跑自测。
      - name: Self test
        run: node --test test/verify.mjs
      # 会话相关的脚本在没有 DSH 会话日志的机器上会自行跳过（打印 skip 并退出 0），
      # 所以整条链在三个平台上都能跑。
      - name: Fixture, client bundle and skip-aware scripts
        run: >-
          node scripts/render-test.mjs &&
          node scripts/client-test.mjs &&
          node scripts/hotplug-test.mjs &&
          node scripts/plugin-smoke.mjs &&
          node scripts/render-check.mjs &&
          node scripts/compose-check.mjs

  manifest:
    name: package manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Declared entry points exist
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const paths = [pkg.main, pkg.icon, pkg.dsh.bundle.patch,
                         pkg.exports['.'], pkg.exports['./client'], pkg.exports['./locale/*.json']];
          const missing = paths.filter(p => p && !p.includes('*') && !fs.existsSync(p));
          if (missing.length) { console.error('missing:', missing); process.exit(1); }
          if (pkg.dsh.client.platform !== 'web') { console.error('platform must be web'); process.exit(1); }
          for (const lang of ['en', 'zh']) {
            const meta = JSON.parse(fs.readFileSync('locale/' + lang + '.json', 'utf8'));
            if (!meta.meta || !meta.meta.title || !meta.meta.description) {
              console.error('locale/' + lang + '.json needs meta.title and meta.description'); process.exit(1);
            }
          }
          console.log('manifest ok');
          "
      - name: No local absolute paths in shipped files
        shell: bash
        run: |
          if grep -rn --exclude-dir=.git --exclude-dir=node_modules -E "/(Users|home)/[A-Za-z0-9_.-]+/" \
              --include='*.md' --include='*.mjs' --include='*.js' --include='*.json' --include='*.yml' . ; then
            echo "::error::found a machine-local absolute path in a shipped file"; exit 1
          fi
          echo "no local paths"
